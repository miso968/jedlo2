<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Pantry.Finder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo">Pantry<span class="dot">.</span>Finder</div>
    <nav><a href="/index.html">Search</a></nav>
  </div>
</header>

<div class="form-card" style="max-width:720px;">
  <div id="login-view">
    <h1>Admin login</h1>
    <form id="login-form" novalidate>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" required />
        <div class="error">Incorrect password.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
      <div class="form-message" id="login-message"></div>
    </form>
  </div>

  <div id="pending-view" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1 style="margin:0;">Pending recipes</h1>
      <button class="btn btn-secondary" id="logout-btn">Log out</button>
    </div>
    <div id="pending-list" style="margin-top:1.2rem;">Loading…</div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
